[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; The game runs on D3D12 with Shader Model 6 only ("RHI D3D12 with Feature Level SM6 is supported and will be used"),
; so shaders are cooked for PCD3D_SM6 alone. The cooker targets every format of every list here
; (GenericWindowsTargetPlatformSettings.h GetAllTargetedShaderFormats: TargetedRHIs, D3D12, D3D11, Vulkan), and
; BaseEngine.ini adds PCD3D_SM5 to both D3D lists: with it each material compiles twice, one format after the other
; (UMaterial::IsCachedCookedPlatformDataLoaded starts a format's compile only once the one before it has finished).
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.Engine]
; Limits the DLC cook of live content to one build's folders (VgeAssetManager.h).
AssetManagerClassName=/Script/VibeGameEngine.VgeAssetManager
